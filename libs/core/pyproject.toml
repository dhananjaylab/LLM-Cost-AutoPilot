[project]
name = "llm-autopilot-core"
version = "0.1.0"
description = "Shared core library — config, DB, schemas, model registry, observability"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.7",
    "structlog>=24.2.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    "prometheus-client>=0.20.0",
    "pyyaml>=6.0.1",
    "tenacity>=8.5.0",
    "pybreaker>=1.2.0",
    # ── Phase 1, Task 2: provider adapters ──────────────────────────────────
    "openai>=1.50.0",
    "anthropic>=0.36.0",
    "google-genai>=0.5.0",
    "groq>=0.11.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_autopilot_core"]
