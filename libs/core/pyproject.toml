[project]
name = "llm-autopilot-core"
version = "0.1.0"
description = "Shared core library — config, DB, schemas, model registry, observability, classifier"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.7",
    "structlog>=24.2.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    "prometheus-client>=0.20.0",
    "pyyaml>=6.0.1",
    "tenacity>=8.5.0",
    "pybreaker>=1.2.0",
    # ── Phase 1, Task 2: provider adapters ──────────────────────────────────
    "openai>=1.50.0",
    "anthropic>=0.36.0",
    "google-genai>=0.5.0",
    "groq>=0.11.0",
    "httpx>=0.27.0",
    # ── Phase 2: complexity classifier ──────────────────────────────────────
    # The API needs these for online classification (routing), not just the
    # worker for offline retraining, and undeclared deps meant uv sync / mypy
    # / CI couldn't see them at all.
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "numpy>=1.26.0",
    # ── Phase 3: semantic cache + task enqueueing ────────────────────────────
    # sentence-transformers backs RedisVL's HFTextVectorizer for the semantic
    # cache — moved here (not Dockerfile.worker's ad hoc install) for the
    # same reason scikit-learn moved here in Phase 2: the API process needs
    # it too, since cache lookups happen on every /v1/completions request,
    # not just during offline retraining.
    "sentence-transformers>=3.0.0",
    "redisvl>=0.5.0",
    # Celery client only (apps/worker declares the full [redis] extra +
    # flower separately) — libs/core just needs enough to construct a
    # producer and call send_task() by name; see tasks_client.py.
    "celery>=5.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_autopilot_core"]
