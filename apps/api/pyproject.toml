[project]
name = "llm-autopilot-api"
version = "0.1.0"
description = "FastAPI service — request intake, routing, cache, metrics"
requires-python = ">=3.11"
dependencies = [
    "llm-autopilot-core",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_autopilot_api"]

# Pin core to workspace source (not PyPI)
[tool.uv.sources]
llm-autopilot-core = { workspace = true }
