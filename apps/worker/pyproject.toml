[project]
name = "llm-autopilot-worker"
version = "0.1.0"
description = "Celery worker — async verification, classifier retraining, cost aggregation"
requires-python = ">=3.11"
dependencies = [
    "llm-autopilot-core",
    "celery[redis]>=5.4.0",
    "flower>=2.0.1",
    "opentelemetry-instrumentation-celery>=0.46b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_autopilot_worker"]

[tool.uv.sources]
llm-autopilot-core = { workspace = true }
