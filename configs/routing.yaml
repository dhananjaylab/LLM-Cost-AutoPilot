# configs/routing.yaml  (bootstrap only — live config is the promoted DB row; see IMPLEMENTATION.md)
# Key format: "<provider>/<model_id>" — must match MODEL_REGISTRY keys.
version: "2"

routing:
  tiers:
    simple:
      description: "Reformatting, extraction, direct Q&A from provided context"
      models:
        - meta-llama/llama-prompt-guard-2-22m
        - groq/llama-3.3-70b-versatile
      max_latency_ms: 3000

    moderate:
      description: "Summarisation, classification, structured analysis"
      # Reordered by verified price (Oct 2026): gpt-4o-mini < Haiku 4.5 < Gemini 3.5 Flash.
      models:
        - openai/gpt-4o-mini
        - anthropic/claude-haiku-4-5
        - google/gemini-3.5-flash
        - meta-llama/llama-prompt-guard-2-22m
      max_latency_ms: 5000

    complex:
      description: "Multi-step reasoning, creative generation, nuanced judgement"
      models:
        - anthropic/claude-sonnet-5-5
        - anthropic/claude-sonnet-4-6
        - openai/gpt-4o
        - google/gemini-3.1-pro-preview
      max_latency_ms: 15000

verification:
  judge_model: anthropic/claude-haiku-4-5
  judge_max_tokens: 512

cost_baseline:
  model: openai/gpt-4o
