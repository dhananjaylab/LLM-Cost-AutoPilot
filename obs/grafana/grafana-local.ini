[server]
http_port = 3000
domain = localhost

[security]
admin_user = admin
admin_password = autopilot
disable_gravatar = true

[users]
allow_sign_up = false

[analytics]
reporting_enabled = false
check_for_updates = false

[paths]
provisioning = A:\LLM-Cost-AutoPilot\infra\grafana\provisioning

[log]
mode = console
level = info

[feature_toggles]
serviceGraph = true
nodeGraph = true
traceToMetrics = true
tempoSearch = true
tempoBackendSearch = true
tempoServiceGraph = true
