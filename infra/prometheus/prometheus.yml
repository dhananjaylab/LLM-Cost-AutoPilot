# Prometheus scrape configuration
# For local (non-Docker) dev: run prometheus.exe --config.file=infra/prometheus/prometheus.yml
# Retention: set via --storage.tsdb.retention.time=30d flag when starting Prometheus
# Scrape interval: 15s globally, overridden per job where needed

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'development'
    project: 'llm-cost-autopilot'

# Alertmanager — uncomment when running alertmanager locally on port 9093
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['localhost:9093']

# Load recording + alert rules from the rules/ subdirectory
rule_files:
  - rules/recording_rules.yml
  - rules/alert_rules.yml

scrape_configs:

  # ── Prometheus self-monitoring ──────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ── FastAPI application (local dev: uvicorn on 8000) ────────────────────────
  - job_name: llm_autopilot_api
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:8000']
        labels:
          service: api

  # ── Celery worker metrics HTTP server (port 9000) ───────────────────────────
  # Worker exposes metrics on port 9000 via prometheus_client.start_http_server()
  # Uncomment once the worker HTTP server is started (Phase 6)
  # - job_name: llm_autopilot_worker
  #   scrape_interval: 15s
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ['localhost:9000']
  #       labels:
  #         service: worker

  # ── Grafana Tempo (local, port 3200) ────────────────────────────────────────
  - job_name: tempo
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:3200']
        labels:
          service: tempo

  # ── Postgres exporter (optional — run postgres_exporter locally on 9187) ────
  # - job_name: postgres
  #   static_configs:
  #     - targets: ['localhost:9187']

  # ── Redis exporter (optional — run redis_exporter locally on 9121) ──────────
  # - job_name: redis
  #   static_configs:
  #     - targets: ['localhost:9121']
