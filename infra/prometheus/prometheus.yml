# Prometheus scrape configuration
# Retention: 30 days (set via CLI flag in docker-compose)
# Scrape interval: 15s globally, overridden per job where needed

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: 'development'
    project: 'llm-cost-autopilot'

# Alertmanager (add in production)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Rule files (add alert rules in Phase 6)
# rule_files:
#   - /etc/prometheus/rules/*.yml

scrape_configs:

  # ── Prometheus self-monitoring ──────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ── FastAPI application ─────────────────────────────────────────────────────
  - job_name: llm_autopilot_api
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000']
        labels:
          service: api

  # ── Celery worker (via prometheus-client HTTP server) ───────────────────────
  # Worker exposes metrics on port 9000 via start_http_server() in Phase 6
  - job_name: llm_autopilot_worker
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:9000']
        labels:
          service: worker

  # ── Postgres exporter (add postgres_exporter container for full DB metrics) ─
  # - job_name: postgres
  #   static_configs:
  #     - targets: ['postgres_exporter:9187']

  # ── Redis exporter ──────────────────────────────────────────────────────────
  # - job_name: redis
  #   static_configs:
  #     - targets: ['redis_exporter:9121']
