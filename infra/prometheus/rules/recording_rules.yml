# Prometheus recording rules — LLM Cost Autopilot
# Pre-computed metrics for expensive dashboard queries.
# Loaded by prometheus.yml → rule_files section.

groups:

  # ── API request metrics ────────────────────────────────────────────────────
  - name: llm_autopilot_api
    interval: 15s
    rules:

      # Total request rate per complexity tier + provider
      - record: job:llm_autopilot_requests:rate5m
        expr: sum by (job, complexity_tier, provider) (rate(llm_autopilot_requests_total[5m]))

      # Overall error rate (errors / total)
      - record: job:llm_autopilot_error_rate:percentage
        expr: |
          (
            sum(rate(llm_autopilot_requests_errors_total[5m]))
            /
            sum(rate(llm_autopilot_requests_total[5m]))
          ) * 100

      # P50 end-to-end latency
      - record: job:llm_autopilot_latency:p50
        expr: |
          histogram_quantile(0.50,
            sum by (le, complexity_tier) (
              rate(llm_autopilot_request_latency_ms_bucket[5m])
            )
          )

      # P95 end-to-end latency
      - record: job:llm_autopilot_latency:p95
        expr: |
          histogram_quantile(0.95,
            sum by (le, complexity_tier) (
              rate(llm_autopilot_request_latency_ms_bucket[5m])
            )
          )

      # P99 end-to-end latency
      - record: job:llm_autopilot_latency:p99
        expr: |
          histogram_quantile(0.99,
            sum by (le, complexity_tier) (
              rate(llm_autopilot_request_latency_ms_bucket[5m])
            )
          )

  # ── Cache metrics ──────────────────────────────────────────────────────────
  - name: llm_autopilot_cache
    interval: 30s
    rules:

      # Cache hit rate as a percentage
      - record: job:llm_autopilot_cache_hit_rate:percentage
        expr: |
          (
            rate(llm_autopilot_cache_hits_total[5m])
            /
            (
              rate(llm_autopilot_cache_hits_total[5m])
              + rate(llm_autopilot_cache_misses_total[5m])
            )
          ) * 100

  # ── Quality / escalation metrics ───────────────────────────────────────────
  - name: llm_autopilot_quality
    interval: 30s
    rules:

      # Escalation rate as a percentage of total requests
      - record: job:llm_autopilot_escalation_rate:percentage
        expr: |
          (
            rate(llm_autopilot_escalations_total[5m])
            /
            rate(llm_autopilot_requests_total[5m])
          ) * 100

      # Average quality score across all verifications
      - record: job:llm_autopilot_quality_score:avg
        expr: |
          histogram_quantile(0.50,
            sum by (le) (
              rate(llm_autopilot_quality_score_bucket[5m])
            )
          )

  # ── Cost metrics ───────────────────────────────────────────────────────────
  - name: llm_autopilot_cost
    interval: 60s
    rules:

      # Cost spend rate per provider (USD/s)
      - record: job:llm_autopilot_cost_usd:rate5m
        expr: sum by (provider) (rate(llm_autopilot_cost_usd_total[5m]))

      # Savings rate vs hypothetical baseline (USD/s)
      - record: job:llm_autopilot_savings_usd:rate5m
        expr: rate(llm_autopilot_cost_savings_usd_total[5m])
