# Grafana Tempo — local configuration (no Docker)
# Run: tempo -config.file=infra/tempo/tempo.yml
# OTLP HTTP receiver: http://localhost:4318
# OTLP gRPC receiver: localhost:4317
# Query HTTP API + Grafana datasource: http://localhost:3200

server:
  http_listen_port: 3200
  log_level: info
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
          cors:
            allowed_origins:
              - "*"

ingester:
  max_block_duration: 5m    # flush traces to storage every 5 min

compactor:
  compaction:
    block_retention: 48h    # keep 48 hours of traces locally

metrics_generator:
  registry:
    external_labels:
      source: tempo
      project: llm-cost-autopilot
  storage:
    path: C:\Temp\tempo\generator\wal
    remote_write:
      - url: http://localhost:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: local
    local:
      path: C:\Temp\tempo\blocks
    wal:
      path: C:\Temp\tempo\wal

overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics
      generate_native_histograms: both
