apiVersion: 1

datasources:

  # ── Prometheus ──────────────────────────────────────────────────────────────
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: "View trace in Tempo"

  # ── Grafana Tempo ───────────────────────────────────────────────────────────
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://localhost:3200
    editable: false
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      traceToLogsV2:
        datasourceUid: loki
      traceToMetrics:
        datasourceUid: prometheus
        queries:
          - name: "Request rate"
            query: "sum(rate(llm_autopilot_requests_total{$$__tags}[5m]))"
          - name: "Error rate"
            query: "sum(rate(llm_autopilot_requests_errors_total{$$__tags}[5m]))"
          - name: "P95 latency"
            query: "histogram_quantile(0.95, sum(rate(llm_autopilot_request_latency_ms_bucket{$$__tags}[5m])) by (le))"
      search:
        hide: false
      lokiSearch:
        datasourceUid: loki
