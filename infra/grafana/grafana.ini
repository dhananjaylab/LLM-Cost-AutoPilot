# Grafana configuration — local (non-Docker) setup
# Place this at: infra/grafana/grafana.ini
# Run: grafana-server --config=infra/grafana/grafana.ini --homepath=<grafana_install_dir>
#
# Windows: grafana-server.exe --config infra/grafana/grafana.ini
# Linux/macOS: ./bin/grafana-server --config infra/grafana/grafana.ini

[server]
http_port = 3000
domain = localhost

[security]
admin_user = admin
admin_password = autopilot
disable_gravatar = true

[users]
allow_sign_up = false

[analytics]
reporting_enabled = false
check_for_updates = false

[paths]
# Dashboards and datasources provisioning
provisioning = infra/grafana/provisioning

[dashboards]
# Where provisioned dashboard JSON files live
default_home_dashboard_path = infra/grafana/dashboards/cost_overview.json

[log]
mode = console
level = info

[feature_toggles]
# Enable service graph + node graph features
serviceGraph = true
nodeGraph = true
traceToMetrics = true
tempoSearch = true
tempoBackendSearch = true
tempoServiceGraph = true
