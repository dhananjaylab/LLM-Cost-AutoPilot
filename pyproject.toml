[tool.uv.workspace]
members = ["apps/*", "libs/*"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "black>=26.5.1",
    "mypy>=1.10.0",
    "pre-commit>=3.8.0",
    "locust>=2.29.0",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ASYNC", "S", "B", "A", "C4", "PT", "RET", "SIM"]
ignore = ["S101", "S104", "A005"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]
"alembic/**" = ["E402"]
# scikit-learn's own convention is X (feature matrix) / y (labels) — renaming to
# lowercase would fight every ML tutorial and scikit-learn's own docs for no
# readability gain.
"scripts/train_classifier.py" = ["N806"]
"tests/unit/test_classifier_model.py" = ["N806"]
# This file is fundamentally a list of literal training-data strings, not logic.
# random.Random is used for reproducible shuffling, not anything security-sensitive.
"scripts/generate_training_data.py" = ["E501", "S311"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
disallow_untyped_decorators = false
ignore_missing_imports = true
exclude = ["alembic/", "scripts/", ".venv/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
