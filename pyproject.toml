# Virtual workspace root — not a package itself.
# Run `uv sync` to install all workspace members + dev deps.

[tool.uv.workspace]
members = ["apps/*", "libs/*"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "black>=24.4.2",
    "mypy>=1.10.0",
    "pre-commit>=3.8.0",
    "locust>=2.29.0",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",
]

# ── Ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",              # isort
    "N",              # pep8-naming
    "UP",             # pyupgrade
    "ASYNC",          # flake8-async
    "S",              # flake8-bandit (security)
    "B",              # flake8-bugbear
    "A",              # flake8-builtins
    "C4",             # flake8-comprehensions
    "PT",             # flake8-pytest-style
    "RET",            # flake8-return
    "SIM",            # flake8-simplify
]
ignore = ["S101", "S104", "A005"]  # allow assert in tests; allow 0.0.0.0 bind; allow logging module name

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]
"alembic/**" = ["E402"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false


# ── Black ────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
disallow_untyped_decorators = false
ignore_missing_imports = true
exclude = ["alembic/", "scripts/"]


# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
